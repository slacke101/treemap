name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --locked --release --package DirMap

      - name: Sign release executable when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\sign-windows-artifacts.ps1 -Files 'target\release\DirMap.exe'

      - name: Package Windows download
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler /Qp /Odist scripts\TreeMap.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Sign Windows installer when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\sign-windows-artifacts.ps1 -Files 'dist\TreeMap-Setup-x64.exe'

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = 'dist\TreeMap-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "dist/TreeMap-Setup-x64.exe" "dist/TreeMap-Setup-x64.exe.sha256"
          "dist/TreeMap-windows-x86_64.zip" "dist/TreeMap-windows-x86_64.zip.sha256"
          --generate-notes --verify-tag