[package]
name = "open-source-core"
version = "0.1.0"
edition = "2024"
description = "Local-first filesystem scanning, indexing, and safe file actions"
readme = "README.md"
license = "MIT"
repository = "https://github.com/slacke101/treemap"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
trash = "5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }